<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Busca de Pessoas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <h1>Busca de Pessoas</h1>
      <p>Pergunte em português. Sua frase é comparada com consultas de referência usando saco de palavras e similaridade de cosseno.</p>
    </header>

    <form id="form-busca" class="busca" role="search">
      <label class="oculto" for="consulta">Sua pergunta</label>
      <input id="consulta" type="search" maxlength="300" autocomplete="off" autofocus required
             placeholder="Ex.: quais pessoas têm cabelo loiro?">
      <button type="submit">Buscar</button>
    </form>

    <div class="exemplos" aria-label="Exemplos de perguntas">
      {% for exemplo in exemplos %}
      <button type="button" class="exemplo">{{ exemplo }}</button>
      {% endfor %}
    </div>

    <section id="resultado" class="resultado" aria-live="polite" hidden>
      <h2 id="mensagem" class="mensagem"></h2>
      <ul id="avisos" class="avisos"></ul>
      <div id="grade" class="grade"></div>
      <div id="grupos" class="grupos"></div>
    </section>

    <details id="painel" class="painel" hidden>
      <summary>Como o motor entendeu a frase</summary>
      <ol id="passos" class="passos"></ol>
    </details>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
